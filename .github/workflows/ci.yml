name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    # Los tests usan SQLite en memoria (ver back/tests/conftest.py), por lo que
    # NO necesitan una base de datos real. Estas variables son solo para que
    # `app/config.py` (pydantic-settings) pueda instanciar Settings al importar.
    env:
      SUPABASE_DATABASE_URL: postgresql://test:test@localhost:5432/zenth_test
      SUPABASE_DB_HOST: localhost
      SUPABASE_DB_PORT: "5432"
      SUPABASE_DB_NAME: zenth_test
      SUPABASE_DB_USER: test
      SUPABASE_DB_PASSWORD: test
      # >=16 caracteres: app/core/security.py rechaza claves más cortas
      JWT_SECRET_KEY: test-secret-key-for-ci-only-1234
      ENVIRONMENT: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest tests/ --cov=app --cov-report=xml -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: back/coverage.xml
          if-no-files-found: ignore

  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test --if-present

      - name: Build
        run: npm run build
