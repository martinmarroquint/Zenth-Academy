[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: tests rápidos sin base de datos
    integration: tests con base de datos y/o cliente HTTP
    security: tests de seguridad y permisos
    e2e: tests end-to-end del flujo completo (solo API HTTP)
    e2e: tests end-to-end que recorren el flujo completo solo por API HTTP
