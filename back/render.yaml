services:
  - type: web
    name: zenth-academy-backend
    runtime: python
    repo: https://github.com/martinmarroquint/ZENTH-ACADEMY.git
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh startup.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_PORT
        value: 5432
      - key: SUPABASE_DB_NAME
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      # Login con Google (ID token / Google Identity Services)
      # OJO: las variables con sync:false NO viajan con el código; hay que
      # definirlas en el dashboard de Render (Environment).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BACKEND_PUBLIC_URL
        value: https://zenth-academy.onrender.com
      - key: FRONTEND_URL
        sync: false